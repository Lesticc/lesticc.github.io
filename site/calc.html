<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Calculadora 2000">
    <meta property="og:site_name" content="https://lestic.site/">
    <meta property="og:description" content="Essa é a calculadora 2000! Diretamente do site de Lestic, perfeita para cálculos usando varíaveis.">
    <meta property="og:type" content="website">
    <meta property="og:author" content="Lestic">
    <meta property="og:locale" content="pt_BR">
    <link rel="icon" href="./index/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./index/css/import.css">
    <link rel="stylesheet" href="./index/css/reset.css">
    <link rel="stylesheet" href="./index/css/base.css">
    <script src="./index/js/calculadora-2000/textos.js"></script>
    <script src="./index/js/header.js"></script>
    <script src="./index/js/calculadora-2000/index.js"></script>
    <title> :: Calculadora 2000 :: </title>
</head>
<body>
    <header id="header">
        <br>
        <ul class="ulHEADER">
            <a href="/site/index.html" class="link-HEADER">Início</a>
            <a href="/site/forum.html" class="link-HEADER">Fórum</a>
            <a href="/site/calc.html" class="link-HEADER-Here">Calculadora</a>
        </ul>
        <br>
        <br>
    </header>
    <noscript lang="en-us">You need to enable JavaScript to run this app.</noscript>
    <main class="main">
        <div class="titulo">
            <h1 style="text-align:center;" class="tituloh1">Calculadora 2000</h1>
        </div>
        <div class="calculadora">
            <main>
                <div>
                    <div class="calc-A">
                        <textarea id="textarea" class="textarea"></textarea>
                    </div>
                </div>
                <div>
                    <div>
                        <div class="botaodiv">
                            <button id="botao" class="botao">Botão do Cálculo</button>
                        </div>
                        <p id="resultado2" class="resultado" style="text-align:center;">Resultado: <span id="resultado"></span></p>
                    </div>
                </div>
            </main>
        </div>
    </main>
    <p id="textos" class="textos">Mensagem base, algum erro aconteceu!</p>
    <br>
    <style>
        .calculadora{
            margin-top:2vh;
            height:20%;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .botaodiv{
            display:block;
            justify-content:center;
            align-items:center;
        }
        .textos{
            text-align:center;
            padding-bottom:50px;
            margin-top:20px;
        }
        .botao{
            display:block;
            padding-bottom:5px;
            margin-top:10px;
            border-radius:13px;
            border:0;
            width:175px;
            height:45px;
            text-align:center;
            font-weight:600;
            background-color:#00c3ff;
            color:#fff;
            cursor:pointer;
            font-size:15px;
            font-family: 'Poppins', sans-serif;
        }
        .botaodiv{
            display:flex;
            align-content:center;
            justify-content:center;
            margin-top:1vh;
            margin-bottom:1vh;
        }
        textarea{
            border-radius:3px;
            font-family: 'Poppins', sans-serif;
            width:200px;
            height:60px;
            outline:none;
            padding:1vh;
        }
        .resultado{
            display:block;
        }
        .main{
            margin-top:2vh;
        }
    </style>
    <footer>
        <p style="text-align:center; color:aquamarine">Criado por: Lestic, Calculadora 2000 ©</p>
    </footer>
    <p style="text-align:center;">Ajuda: Lohran</p>
</body>
</html>
